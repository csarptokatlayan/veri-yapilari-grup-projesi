version: '3.8'

services:
  backend:
    build: ./backend
    container_name: socialnetwork-backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: socialnetwork-frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped